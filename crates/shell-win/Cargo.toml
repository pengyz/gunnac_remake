[package]
name = "shell-win"
version = "0.1.0"
edition = "2021"

# 平台实现 crate：平台依赖（winit/softbuffer）只允许出现在这里（AGENTS.md §2 + platform-shell.md §7）。
# game-core/game-platform/game-shell/game-data 均为纯逻辑/纯契约/纯解析 crate（零平台依赖）。
[dependencies]
game-core = { path = "../game-core" }
game-data = { path = "../game-data" }
game-platform = { path = "../game-platform" }
game-shell = { path = "../game-shell" }
winit = "0.30"
softbuffer = "0.4"

[[bin]]
name = "shell-win"
path = "src/main.rs"
